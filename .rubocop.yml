inherit_from: .rubocop_todo.yml

# local repo-specific modifications
# ...

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable

plugins:
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec

# Cops excluded because the todo generator doesn't auto-disable them
# globally — only per-file. Excludes here cover all gems. Re-enable
# one at a time when ready to fix the underlying offense.
Performance/CollectionLiteralInLoop:
  Enabled: false
Naming/PredicateName:
  Enabled: false
Style/HashLikeCase:
  Enabled: false
Lint/DuplicateBranch:
  Enabled: false
Performance/MapCompact:
  Enabled: false
Performance/MethodObjectAsBlock:
  Enabled: false
Style/EmptyElse:
  Enabled: false
Metrics/ParameterLists:
  Enabled: false
RSpec/ExampleLength:
  Enabled: false
RSpec/MultipleExpectations:
  Enabled: false
RSpec/DescribeClass:
  Enabled: false
